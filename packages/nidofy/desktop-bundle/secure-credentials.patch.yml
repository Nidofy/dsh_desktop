# Explicit Windows test/deployment overlay. It is not part of the bundle's default patches.
- id: credentials
  name: '@nidofy/dsh-secure-credentials'
  config:
    applicationId: nidofy-desktop
    profileId: desktop
    dshHome: !!js process.env.DSH_HOME
    maxPlaintextBytes: 524288
    backendTimeoutMs: 10000
    lockWaitMs: 10000
    refreshIntervalMs: 1000
